  <rect x="253" y="330" width="448" height="218" rx="12" fill="#fff" stroke="#e8ecf0"/><text x="278" y="362" font-size="14" font-family="Arial" font-weight="700" fill="#172233">Sample design</text><text x="278" y="402" font-size="12" font-family="Arial" fill="#465266">🎓  University students</text><text x="638" y="402" font-size="12" font-family="Arial" font-weight="700" fill="#465266">500</text><line x1="278" y1="418" x2="675" y2="418" stroke="#edf0f3"/><text x="278" y="447" font-size="12" font-family="Arial" fill="#465266">💼  Working adults</text><text x="638" y="447" font-size="12" font-family="Arial" font-weight="700" fill="#465266">500</text><rect x="278" y="482" width="200" height="9" rx="4" fill="#7054ef"/><rect x="478" y="482" width="197" height="9" rx="4" fill="#ef9e59"/><text x="278" y="516" font-size="10" font-family="Arial" fill="#758196">● Students 50%</text><text x="591" y="516" font-size="10" font-family="Arial" fill="#758196">● Adults 50%</text>
