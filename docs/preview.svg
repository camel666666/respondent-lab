<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Respondent Lab dashboard preview</title>
  <desc id="desc">Illustration of the sample design and answer distribution interface.</desc>
  <rect width="1200" height="580" rx="22" fill="#f7f8f5"/>
  <rect width="220" height="580" rx="22" fill="#101827"/><rect x="192" width="28" height="580" fill="#101827"/>
  <rect x="27" y="29" width="34" height="34" rx="10" fill="#fff"/><text x="38" y="54" font-size="24" font-family="Arial" font-weight="800" fill="#172233">R</text><text x="76" y="46" font-size="16" font-family="Arial" font-weight="700" fill="#fff">Respondent Lab</text><text x="76" y="64" font-size="10" font-family="Arial" fill="#8792a3">SURVEY WORKBENCH</text>
  <text x="31" y="128" font-size="11" font-family="Arial" fill="#667184">WORKSPACE</text><rect x="18" y="147" width="184" height="36" rx="8" fill="#263148"/><text x="34" y="170" font-size="13" font-family="Arial" fill="#fff">▦  Overview</text><text x="34" y="215" font-size="13" font-family="Arial" fill="#a9b3c3">◎  Sample design</text><text x="34" y="254" font-size="13" font-family="Arial" fill="#a9b3c3">▥  Results</text><text x="34" y="293" font-size="13" font-family="Arial" fill="#a9b3c3">◇  Method</text>
  <rect x="220" width="980" height="57" fill="#fff"/><text x="260" y="35" font-size="12" font-family="Arial" fill="#758196">Workspace / Overview</text><rect x="1046" y="18" width="106" height="23" rx="6" fill="#f0ecff"/><text x="1067" y="34" font-size="11" font-family="Arial" fill="#7054ef">DEMO MODE</text>
  <rect x="253" y="82" width="914" height="230" rx="14" fill="#fff" stroke="#e8ecf0"/><text x="291" y="119" font-size="11" font-family="Arial" font-weight="700" letter-spacing="2" fill="#7054ef">✦ SURVEY PRETESTING</text><text x="290" y="168" font-size="32" font-family="Arial" font-weight="800" fill="#172233">Rehearse your survey</text><text x="290" y="205" font-size="32" font-family="Arial" font-weight="800" fill="#7054ef">before you send it.</text><text x="291" y="239" font-size="12" font-family="Arial" fill="#8994a5">Set sample quotas, simulate answers, and inspect assumptions.</text><rect x="291" y="259" width="140" height="34" rx="7" fill="#7054ef"/><text x="312" y="281" font-size="12" font-family="Arial" font-weight="700" fill="#fff">Design sample →</text>
