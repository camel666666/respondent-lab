name: Bug report
description: Report an issue without sharing personal data or keys
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal fictional questionnaire.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
